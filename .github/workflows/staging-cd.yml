name: Automatic Shared Staging CD

on:
  workflow_run:
    workflows: [Continuous Integration]
    branches: [master]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: convy-staging-cd
  cancel-in-progress: false

jobs:
  build:
    # Missing flag is false. First activation is an explicit separate operator task.
    if: >-
      vars.STAGING_CD_ENABLED == 'true' &&
      github.repository == 'Monkey-D-Luisi/convy' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    outputs:
      source: ${{ steps.identity.outputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Verify successful exact master CI and build immutable images outside staging
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_BASELINE: ${{ vars.STAGING_SCHEMA_BASELINE_SHA }}
        run: |
          set -euo pipefail
          python ops/vps/staging-build.py --baseline "$SCHEMA_BASELINE" --output release
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Sign manifest including exact CI identity and file checksums
        id: attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/release.json
      - name: Include attestation bundle
        env:
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
        run: cp "$BUNDLE" release/attestation.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-release-${{ steps.identity.outputs.source }}
          path: release/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    if: vars.STAGING_CD_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: staging
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: staging-release-${{ needs.build.outputs.source }}
          path: release
      - name: Verify provenance before access to the staging SSH key
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ needs.build.outputs.source }}
        run: |
          set -euo pipefail
          gh attestation verify release/release.json --repo Monkey-D-Luisi/convy --bundle release/attestation.json --signer-workflow Monkey-D-Luisi/convy/.github/workflows/staging-cd.yml --cert-identity https://github.com/Monkey-D-Luisi/convy/.github/workflows/staging-cd.yml@refs/heads/master --source-ref refs/heads/master --source-digest "$SOURCE" --signer-digest "$SOURCE" --deny-self-hosted-runners
      - name: Constrained transfer and automatic acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          STAGING_HOST: ${{ vars.STAGING_CD_HOST }}
          KNOWN_HOSTS_SHA256: ${{ vars.STAGING_CD_KNOWN_HOSTS_SHA256 }}
          KNOWN_HOSTS: ${{ secrets.STAGING_CD_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.STAGING_CD_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f "$RUNNER_TEMP/cd-key" "$RUNNER_TEMP/cd-known-hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/cd-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/cd-known-hosts"
          python ops/vps/staging-transfer.py --bundle release --host "$STAGING_HOST" --key "$RUNNER_TEMP/cd-key" --known-hosts "$RUNNER_TEMP/cd-known-hosts" --known-hosts-sha256 "$KNOWN_HOSTS_SHA256"
