name: Backend Staging Release

# There is no CI-completion trigger and no deployment job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the release boundary
        run: |
          echo 'Automatic deployment is disabled. A reviewed immutable artifact and explicit operator approval are required.'
          echo 'This workflow has no SSH credentials, environment, or production access.'
